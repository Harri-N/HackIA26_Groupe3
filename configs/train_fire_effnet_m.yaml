# Training config for Fire classification (EfficientNet-V2-M on FIRE_DATABASE_3).
# Loaded by src/train_fire.py — same script as the other runs.
# Mirrors configs/train_fire_effnet.yaml so the only material change is the
# backbone (V2-S -> V2-M) and a smaller batch (54M params vs 21M).

# --- model --------------------------------------------------------------
model: efficientnet_v2_m   # ~54M params, IMAGENET1K_V1 weights
pretrained: true
num_classes: 3
class_names: [no_fire, start_fire, fire]

# --- data ---------------------------------------------------------------
data_dir: data/FIRE_DATABASE_3
val_split: 0.2
imgsz: 224                  # same as other runs for a clean comparison
batch_size: 24
workers: 0
seed: 42

# --- schedule -----------------------------------------------------------
epochs: 30
patience: 8

# --- optimizer ----------------------------------------------------------
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
warmup_epochs: 3
cos_lr: true
label_smoothing: 0.1

# --- augmentation -------------------------------------------------------
hflip: 0.5
color_jitter: 0.2
random_erasing: 0.1

# --- runtime ------------------------------------------------------------
precision: 16-mixed
device: cuda
gpus: 1

# --- logging / output ---------------------------------------------------
project_dir: models/fire
run_name: effnet_v2_m_fire3_v1
save_top_k: 1
log_every_n_steps: 5
