# Training config for Fire classification (Swin-T on FIRE_DATABASE_MERGED).
# Loaded by src/train_fire.py.

# --- model --------------------------------------------------------------
model: swin_b              # torchvision: swin_t / swin_s / swin_b / swin_v2_t / swin_v2_s
pretrained: true
num_classes: 3
class_names: [no_fire, start_fire, fire]   # forced order; aligns with D-Fire smoke/fire bboxes

# --- data ---------------------------------------------------------------
data_dir: data/FIRE_DATABASE_3   # 500 images per class
val_split: 0.2
imgsz: 224
batch_size: 24
workers: 0                 # forced 0: Python 3.13 conda env has multiprocessing IPC quirks
seed: 42

# --- schedule -----------------------------------------------------------
epochs: 30
patience: 8                # early stop on val_acc plateau

# --- optimizer ----------------------------------------------------------
optimizer: adamw
lr: 0.00005                # smaller lr for swin_b (88M params, 1000-img dataset)
weight_decay: 0.05
warmup_epochs: 3
cos_lr: true
label_smoothing: 0.1

# --- augmentation -------------------------------------------------------
hflip: 0.5
color_jitter: 0.2
random_erasing: 0.1

# --- runtime ------------------------------------------------------------
precision: 16-mixed        # 16-mixed | bf16-mixed | 32
device: cuda
gpus: 1

# --- logging / output ---------------------------------------------------
project_dir: models/fire
run_name: swin_b_fire3_v1
save_top_k: 1              # keep only best val_acc checkpoint
log_every_n_steps: 5
